name: hasura
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: hasura/graphql-engine:latest
    container_name: hasura-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: hasura-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      HASURA_GRAPHQL_DATABASE_URL: postgresql://${DB_USER_NAME:-hasura}:${DB_USER_PASS:-replace-with-a-random-password}@hasura-db:5432/${DB_CREATE_DATABASE_NAME:-hasura}
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgresql://${DB_USER_NAME:-hasura}:${DB_USER_PASS:-replace-with-a-random-password}@hasura-db:5432/${DB_CREATE_DATABASE_NAME:-hasura}
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true'
      HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
      HASURA_GRAPHQL_ADMIN_SECRET: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"HS256","key":"${APP_SECRET_KEY:-replace-with-a-random-32-byte-hex-string}"}'
    depends_on:
      hasura-db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.hasura-app.entrypoints=http'
      - 'traefik.http.routers.hasura-app.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.middlewares.hasura-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.hasura-app.middlewares=hasura-app-https-redirect'
      - 'traefik.http.routers.hasura-app-secure.entrypoints=https'
      - 'traefik.http.routers.hasura-app-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.hasura-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.hasura-app-secure.service=hasura-app'
      - 'traefik.http.services.hasura-app.loadbalancer.server.port=8080'
    networks:
      - hasura
      - traefik

  hasura-db:
    image: postgres:latest
    container_name: hasura-db
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: hasura-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: hasura-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-hasura}
      POSTGRES_USER: ${DB_USER_NAME:-hasura}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/hasura:/var/lib/postgresql:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER_NAME:-hasura} -d ${DB_CREATE_DATABASE_NAME:-hasura}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hasura

networks:
  hasura:
    name: hasura
    external: false
  traefik:
    external: true
